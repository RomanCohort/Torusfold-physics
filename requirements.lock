# TorusFold-Hybrid — reference environment, pinned where a version was recorded.
#
# WHAT THIS FILE IS. `requirements.txt` is the loose, human-facing list; this is the
# recorded one. Every pin below carries the file that recorded it, because a pin
# without a source is a guess, and this repository's rule is that figures are never
# estimated. Where no version was ever recorded, the entry says so instead of
# inventing a range that would look like a lock and behave like a wish.
#
# THE ENVIRONMENT THESE COME FROM. `C:\ana\envs\circrna3d` (conda, Windows) is the
# CPU environment the pipeline and its tests were run in
# (docs/pipeline_audit_2026-09-13.md:1026, :534). The GPU environment is
# `C:\ana\envs\comfyui` (:535, :519). The tests pass there: 145 tests in 24 s (:1027).
# Nothing here was measured on a second machine, so nothing here is known to be
# sufficient — it is known to be what ran.
#
# HOW TO CLOSE THE GAPS, on the reference machine:
#     conda activate circrna3d
#     python -m pip freeze > requirements.freeze.txt
# and replace the UNKNOWN block below with the numpy/scipy lines from that file,
# keeping this header. A full freeze is more useful than the three lines below: it is
# what makes `pip install -r` reproduce the environment rather than approximate it.

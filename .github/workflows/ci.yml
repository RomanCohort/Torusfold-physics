# GitHub Actions — the same gate as .gitlab-ci.yml, for the mirror.
#
# WHY THIS EXISTS. The repository is pushed to two remotes: GitLab is the iGEM delivery
# channel, GitHub (RomanCohort/Torusfold-physics) is the mirror. Only GitLab had CI, and
# GitLab's version could not pass -- it installed numpy and ran a pytest that was never
# installed, against a suite that collected zero tests. Both are fixed; this file keeps
# the mirror honest, and it is the one of the two that can be observed from here.
#
# The two files are deliberately near-identical in what they run. If you change the
# gate's scope, change both. That instruction is load-bearing in this repository because
# the same document already exists twice on purpose (see tests/test_skills_in_sync.py,
# which fails when the two skill copies drift); two CI files that gate the same code and
# are allowed to diverge is the same defect with a worse blast radius.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A queued push supersedes an in-flight run for the same branch. Different from the
  # GitLab side, which has no equivalent, and safe here: the gate is stateless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test suite (no torch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      # pytest is not declared anywhere installable -- not in pyproject.toml, not in
      # requirements.txt, not in an extras group. It has to be named explicitly, which is
      # exactly the line the previous GitLab config was missing.
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          # WITH dependencies, on purpose. `--no-deps` is what made every pin in
          # pyproject.toml decorative and resolved openmm to 8.6.1.dev instead of the
          # pinned 8.5.2. Measured 2026-10-02.
          python -m pip install --quiet -e .

      - name: Show the versions this gate ran against
        run: |
          python -c "import openmm, numpy, scipy; print('openmm', openmm.version.version, '| numpy', numpy.__version__, '| scipy', scipy.__version__)"

      # Scope, stated so the log is not read as more than it is. Measured 2026-10-02 in
      # this exact configuration: 36 test modules on disk, 24 excluded, 12 executed ->
      # 39 passed, 3 skipped in 4.4 s. Of the 24 exclusions, 15 import torch (or call
      # importorskip("torch") at module level), 8 reach torch through something they
      # import, and 1 is a standalone script. The full suite is 282 passed / 2 skipped
      # and needs torch. README.md "Testing & CI".
      #
      # A collection error aborts this step, and that is the property the gate relies
      # on: a new test module that cannot be collected fails here rather than quietly
      # reducing coverage.
      - name: Test suite
        run: python -m pytest -q tests

      - name: Report the gate's own coverage
        run: python -m pytest -q tests/test_ci_gate_is_visible.py -s

  headline:
    name: published numbers reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install numpy
        run: python -m pip install --quiet --upgrade pip numpy

      # The one command in this repository that answers "is what we published actually
      # reproducible from what we committed". numpy only -- no OpenMM, no torch, no GPU.
      #
      # `--allow-known` is not a way to hide a failure: the bare command exits 1, and its
      # 12 non-reproducing checks are one cause, not twelve -- the same coordinate
      # (intra_pc) in twelve runs, which the script reports as KNOWN = {"intra_pc"}. The
      # flag moves that behind the exit code and leaves it in the printed report.
      #
      # `tee` keeps the report as an artifact and `|| true` stops a non-zero exit here so
      # the next step still uploads it. The step above is the one that gates the build;
      # this one is the record.
      - name: verify_headline
        run: python scripts/verify_headline.py --allow-known

      - name: Keep the full report as an artifact
        if: always()
        run: python scripts/verify_headline.py 2>&1 | tee headline_report.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headline-report
          path: headline_report.txt
          if-no-files-found: ignore
